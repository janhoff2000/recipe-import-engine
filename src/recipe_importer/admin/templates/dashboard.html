<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Import Engine — Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        :root {
            --bg: #0f1117;
            --card: #1a1d27;
            --border: #2a2d37;
            --text: #e4e4e7;
            --muted: #71717a;
            --accent: #6366f1;
            --green: #22c55e;
            --red: #ef4444;
            --yellow: #eab308;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 24px;
            min-height: 100vh;
        }
        h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 24px; }
        h2 { font-size: 1.1rem; font-weight: 500; margin-bottom: 16px; color: var(--muted); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
        }
        .stat-value { font-size: 2rem; font-weight: 700; }
        .stat-label { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
        .chart-container { position: relative; height: 300px; }
        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
        th { text-align: left; padding: 10px 12px; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 500; }
        td { padding: 10px 12px; border-bottom: 1px solid var(--border); }
        tr:hover td { background: rgba(99, 102, 241, 0.05); }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 9999px;
            font-size: 0.75rem; font-weight: 500;
        }
        .badge-success { background: rgba(34, 197, 94, 0.15); color: var(--green); }
        .badge-error { background: rgba(239, 68, 68, 0.15); color: var(--red); }
        .loading { text-align: center; padding: 40px; color: var(--muted); }
        .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
        .tab {
            padding: 6px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: none; color: var(--muted); cursor: pointer; font-size: 0.85rem;
        }
        .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
    </style>
</head>
<body>
    <h1>Recipe Import Engine</h1>

    <!-- Summary Cards -->
    <div class="grid" id="summary-cards">
        <div class="card"><div class="loading">Loading...</div></div>
    </div>

    <!-- Model Comparison Charts -->
    <h2>Model Comparison</h2>
    <div class="grid">
        <div class="card">
            <div class="chart-container"><canvas id="costChart"></canvas></div>
        </div>
        <div class="card">
            <div class="chart-container"><canvas id="latencyChart"></canvas></div>
        </div>
        <div class="card">
            <div class="chart-container"><canvas id="successChart"></canvas></div>
        </div>
        <div class="card">
            <div class="chart-container"><canvas id="qualityChart"></canvas></div>
        </div>
    </div>

    <!-- Trend Chart -->
    <h2>Quality Over Time</h2>
    <div class="card" style="margin-bottom: 24px;">
        <div class="chart-container"><canvas id="trendChart"></canvas></div>
    </div>

    <!-- Recent Extractions -->
    <h2>Recent Extractions</h2>
    <div class="card">
        <div class="tabs" id="model-tabs"></div>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>URL</th>
                        <th>Model</th>
                        <th>Latency</th>
                        <th>Cost</th>
                        <th>Quality</th>
                        <th>Status</th>
                        <th>Edited</th>
                    </tr>
                </thead>
                <tbody id="records-table">
                    <tr><td colspan="8" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

<script>
const COLORS = ['#6366f1', '#22c55e', '#eab308', '#ef4444', '#06b6d4', '#f97316'];

Chart.defaults.color = '#71717a';
Chart.defaults.borderColor = '#2a2d37';

async function fetchJSON(url) {
    const res = await fetch(url);
    if (!res.ok) return null;
    return res.json();
}

function barChart(canvasId, labels, data, label, format) {
    const ctx = document.getElementById(canvasId);
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: label,
                data: data,
                backgroundColor: labels.map((_, i) => COLORS[i % COLORS.length] + '80'),
                borderColor: labels.map((_, i) => COLORS[i % COLORS.length]),
                borderWidth: 1,
                borderRadius: 6,
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: { display: false },
                title: { display: true, text: label, padding: { bottom: 12 } },
                tooltip: {
                    callbacks: { label: (ctx) => format ? format(ctx.raw) : ctx.raw }
                }
            },
            scales: { y: { beginAtZero: true } }
        }
    });
}

let trendChartInstance = null;

async function loadDashboard() {
    const [comparison, records, trends] = await Promise.all([
        fetchJSON('/v1/stats/comparison'),
        fetchJSON('/v1/stats/records?limit=50'),
        fetchJSON('/v1/stats/trends?days=30'),
    ]);

    // Summary cards
    if (comparison && comparison.length > 0) {
        const totalExtractions = comparison.reduce((s, m) => s + m.total_extractions, 0);
        const avgQuality = comparison.reduce((s, m) => s + m.avg_quality_score * m.total_extractions, 0) / (totalExtractions || 1);
        const totalCost = comparison.reduce((s, m) => s + m.total_cost_usd, 0);
        const avgSuccess = comparison.reduce((s, m) => s + m.success_rate * m.total_extractions, 0) / (totalExtractions || 1);

        document.getElementById('summary-cards').innerHTML = `
            <div class="card"><div class="stat-value">${totalExtractions}</div><div class="stat-label">Total Extractions</div></div>
            <div class="card"><div class="stat-value">${(avgQuality * 100).toFixed(1)}%</div><div class="stat-label">Avg Quality Score</div></div>
            <div class="card"><div class="stat-value">$${totalCost.toFixed(4)}</div><div class="stat-label">Total Cost</div></div>
            <div class="card"><div class="stat-value">${(avgSuccess * 100).toFixed(1)}%</div><div class="stat-label">Success Rate</div></div>
        `;

        // Bar charts
        const labels = comparison.map(m => m.model);
        barChart('costChart', labels, comparison.map(m => m.avg_cost_usd * 1000), 'Avg Cost ($ per 1K)', v => `$${v.toFixed(4)}`);
        barChart('latencyChart', labels, comparison.map(m => m.avg_latency_ms), 'Avg Latency (ms)', v => `${v.toFixed(0)}ms`);
        barChart('successChart', labels, comparison.map(m => m.success_rate * 100), 'Success Rate (%)', v => `${v.toFixed(1)}%`);
        barChart('qualityChart', labels, comparison.map(m => m.avg_quality_score * 100), 'Avg Quality (%)', v => `${v.toFixed(1)}%`);

        // Model tabs
        const tabsEl = document.getElementById('model-tabs');
        const allModels = ['all', ...labels];
        tabsEl.innerHTML = allModels.map(m =>
            `<button class="tab ${m === 'all' ? 'active' : ''}" onclick="filterRecords('${m}')">${m === 'all' ? 'All Models' : m}</button>`
        ).join('');
    } else {
        document.getElementById('summary-cards').innerHTML =
            '<div class="card"><div class="loading">No data yet. Import some recipes to see stats.</div></div>';
    }

    // Trend chart
    if (trends && trends.length > 0) {
        const models = [...new Set(trends.map(t => t.model))];
        const dates = [...new Set(trends.map(t => t.date))].sort();
        const datasets = models.map((model, i) => ({
            label: model,
            data: dates.map(d => {
                const entry = trends.find(t => t.date === d && t.model === model);
                return entry ? entry.avg_quality * 100 : null;
            }),
            borderColor: COLORS[i % COLORS.length],
            tension: 0.3,
            spanGaps: true,
        }));
        const ctx = document.getElementById('trendChart');
        trendChartInstance = new Chart(ctx, {
            type: 'line',
            data: { labels: dates, datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { title: { display: true, text: 'Quality Score Over Time (%)' } },
                scales: { y: { beginAtZero: true, max: 100 } }
            }
        });
    }

    // Records table
    if (records) {
        window._allRecords = records;
        renderRecords(records);
    }
}

function renderRecords(records) {
    const tbody = document.getElementById('records-table');
    if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="loading">No records found.</td></tr>';
        return;
    }
    tbody.innerHTML = records.map(r => `
        <tr>
            <td>${new Date(r.timestamp).toLocaleString()}</td>
            <td title="${r.url}" style="max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${r.url}</td>
            <td>${r.model}</td>
            <td>${r.latency_ms}ms</td>
            <td>${r.estimated_cost_usd != null ? '$' + r.estimated_cost_usd.toFixed(6) : '—'}</td>
            <td>${(r.quality_score * 100).toFixed(1)}%</td>
            <td><span class="badge ${r.success ? 'badge-success' : 'badge-error'}">${r.success ? 'OK' : r.error_type || 'Error'}</span></td>
            <td>${r.human_edited === true ? 'Yes' : r.human_edited === false ? 'No' : '—'}</td>
        </tr>
    `).join('');
}

function filterRecords(model) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    if (model === 'all') {
        renderRecords(window._allRecords);
    } else {
        renderRecords(window._allRecords.filter(r => r.model === model));
    }
}

loadDashboard();
</script>
</body>
</html>
