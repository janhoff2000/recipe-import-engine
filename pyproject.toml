[project]
name = "recipe-import-engine"
version = "0.2.0"
description = "Recipe extraction service with model comparison and tracking"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "openai>=1.50.0",
    "google-genai>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "aiosqlite>=0.20.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "basedpyright>=1.22.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
recipe-importer = "recipe_importer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_importer"]

# === RUFF: Fast linting and formatting ===
[tool.ruff]
line-length = 100
target-version = "py313"  # py314 not yet supported by ruff
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations (require type annotations)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
]
# No ignored rules

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # Don't require annotations in tests

# === BASEDPYRIGHT: Strict type checking ===
[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportPrivateImportUsage = "warning"
exclude = ["tests/"]

# === PYTEST ===
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
