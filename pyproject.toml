[project]
name = "recipe-import-engine"
version = "0.1.0"
description = "Multi-provider recipe extraction service with BYOK support"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
    "anthropic>=0.40.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "basedpyright>=1.22.0",
    "pre-commit>=4.0.0",
]

[project.scripts]
recipe-importer = "recipe_importer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recipe_importer"]

# === RUFF: Fast linting and formatting ===
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "W",     # pycodestyle warnings
    "UP",    # pyupgrade
    "ANN",   # flake8-annotations (require type annotations)
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "RUF",   # ruff-specific rules
]
ignore = [
    "ANN101",  # Missing type annotation for `self`
    "ANN102",  # Missing type annotation for `cls`
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]  # Don't require annotations in tests

# === BASEDPYRIGHT: Strict type checking ===
[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "all"  # Strictest mode
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
reportUnknownVariableType = "warning"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"

# === PYTEST ===
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

